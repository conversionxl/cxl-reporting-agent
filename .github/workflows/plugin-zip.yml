name: Plugin ZIP

# Publishes reporting-agent.zip to the "plugin-zips" release, for people who can't
# add the marketplace and upload the plugin in Settings -> Plugins instead.
# Stable link:
#   https://github.com/conversionxl/cxl-reporting-agent/releases/download/plugin-zips/reporting-agent.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    # Only in CXL's repo, not in members' copies of a starter repo.
    if: github.repository == 'conversionxl/cxl-reporting-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: bash scripts/build-zip.sh

      - name: Publish to the plugin-zips release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(jq -r .version .claude-plugin/plugin.json)
          notes="Upload reporting-agent.zip in Settings -> Plugins if you can't add the marketplace. Don't unzip it.

          reporting-agent $ver, built from ${GITHUB_SHA::7}. Don't use the repository's green Code -> Download ZIP button: it wraps the plugin in a folder and fails the upload check."
          if ! gh release view plugin-zips >/dev/null 2>&1; then
            gh release create plugin-zips --title "Plugin ZIP" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release edit plugin-zips --title "Plugin ZIP" --notes "$notes"
          fi
          gh release upload plugin-zips dist/reporting-agent.zip --clobber
